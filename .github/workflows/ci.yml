name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run links

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: exposure
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: exposure_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exposure -d exposure_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://exposure:disposable-test-only@127.0.0.1:5432/exposure_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:db

  archives:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: exposure
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: exposure_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exposure -d exposure_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://exposure:disposable-test-only@127.0.0.1:5432/exposure_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: mkdir -p artifacts
      - run:
          node scripts/acquire-feeds.mjs artifacts/official-archives 2026-11-09
      - name: Verify recorded archive identities and complete row counts
        run: |
          node --input-type=module - <<'JS'
          import { readFile } from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const actual = JSON.parse(await readFile('artifacts/official-archives/summary.json', 'utf8'));
          const recorded = JSON.parse(await readFile('examples/feed-acquisition.json', 'utf8'));
          assert.equal(actual.complete, true);
          assert.equal(actual.protocol, recorded.protocol);
          const stable = ({ startedAt, retrievedAt, ...record }) => record;
          assert.deepEqual(actual.records.map(stable), recorded.records.map(stable));
          console.log('Verified complete archived source identities and counts');
          JS
      - name: Verify every archived row after PostgreSQL activation
        run: node scripts/verify-archive-store.mjs artifacts/official-archives
      - uses: actions/upload-artifact@v4
        with:
          name: official-archives-provenance
          path: artifacts/official-archives/summary.json
          if-no-files-found: error
          retention-days: 7
